# Serves the built app and forwards /api to the backend container, which is what makes
# `baseURL: ''` correct in production — one origin, no cross-origin request to permit.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Via Docker's DNS, not an `upstream` block: nginx resolves a static upstream once at
    # startup, so a rebuilt API container gets a new address and every request 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location /api/ {
        # A variable defers the DNS lookup to request time, but also stops nginx
        # forwarding the URI automatically — hence the explicit $request_uri.
        set $api http://api:8000;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One identifier across both logs; the API generates one if this is absent.
        proxy_set_header X-Request-ID $request_id;
        # Reports are generated on demand and the live ones read external sources, so
        # the default 60s would cut off a legitimate request.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        set $api_docs http://api:8000;
        proxy_pass $api_docs$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed names, so a year-long cache is safe. The security headers repeat in
    # every location because add_header *replaces* an outer block's rather than merging.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The opposite case: the name never changes but the contents do, and a cached copy
    # would keep pointing at the previous build's asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: a reload on /funding has no file, and 404ing there is the
    # classic single-page-app deployment fault.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
