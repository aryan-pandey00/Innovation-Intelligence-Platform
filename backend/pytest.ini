[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short
filterwarnings =
    # Starlette's TestClient asks for httpx2; not our code, and it prints once per test.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # passlib reads bcrypt's version through an attribute bcrypt 4 moved.
    ignore:.*error reading bcrypt version.*:UserWarning
